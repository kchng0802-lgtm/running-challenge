<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Broadcom Running Challenge</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B2A4A" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Run Challenge" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; color: #16202B; background: #E9EBEE; }

  .app {
    --navy: #0B2A4A; --navy-deep: #071A30; --teal: #1F9C8C; --teal-light: #E4F5F2;
    --gold: #E3A62F; --gold-light: #FBF0DA; --paper: #F7F5F0; --ink: #16202B;
    --ink-soft: #5B6B7A; --line: #E2E1DA; --white: #FFFFFF; --red: #A32E2E; --red-light: #FDEDED;
    max-width: 680px; margin: 0 auto; background: var(--paper); min-height: 100vh;
    box-shadow: 0 0 50px rgba(0,0,0,0.08);
  }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- Brand header ---------- */
  .brandbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; background: var(--white); border-bottom: 1px solid var(--line);
  }
  .brandbar .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: var(--navy); letter-spacing: 0.02em; }
  .brandbar .wordmark small { display: block; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 10px; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
  .brandbar .spacer { flex: 1; }
  .brandbar .top-link { font-size: 12px; color: var(--ink-soft); text-decoration: none; font-weight: 600; }
  .brandbar .top-link:hover { color: var(--navy); }

  /* ---------- Hero ---------- */
  .hero { background: linear-gradient(160deg, var(--navy-deep), var(--navy)); color: var(--white); padding: 26px 22px 20px; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .hero-title { font-size: 19px; font-weight: 700; }
  .hero-sub { color: #A9BBCC; font-size: 12px; margin-top: 4px; }
  .hero-stat { text-align: right; }
  .hero-stat .num { font-size: 26px; font-weight: 700; color: var(--gold); line-height: 1; }
  .hero-stat .label { font-size: 10.5px; color: #A9BBCC; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 3px; }
  .track-wrap { margin-top: 18px; }
  .track { height: 30px; border-radius: 15px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); position: relative; overflow: hidden; }
  .track::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255,255,255,0.10) 20px, rgba(255,255,255,0.10) 24px); }
  .track-fill { height: 100%; background: linear-gradient(90deg, var(--teal), #38C6B3); border-radius: 15px; transition: width 0.6s ease; min-width: 30px; }
  .track-runner { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 16px; transition: left 0.6s ease; }
  .track-labels { display: flex; justify-content: space-between; font-size: 10px; color: #8FA3B8; margin-top: 6px; font-family: 'IBM Plex Mono', monospace; }
  .profile-chip { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: #A9BBCC; flex-wrap: wrap; }
  .cat-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.03em; }
  .cat-badge.Beginner { background: #E4F5F2; color: #146B5F; }
  .cat-badge.Intermediate { background: #FBF0DA; color: #8A6110; }
  .cat-badge.Expert { background: #FDEDED; color: #A32E2E; }
  .profile-chip button { background: none; border: none; color: #A9BBCC; text-decoration: underline; font-size: 11px; cursor: pointer; padding: 0; }
  .profile-chip button:hover { color: var(--white); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; padding: 8px 14px 0; background: var(--white); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; padding: 12px 13px; background: none; border: none; color: var(--ink-soft); cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
  .panel { padding: 20px 20px 30px; background: var(--white); min-height: 320px; }

  /* ---------- Landing / Login / Register ---------- */
  .landing { padding: 50px 26px; text-align: center; position: relative; overflow: hidden; }
  .bg-track { position: absolute; top: 8%; left: 50%; transform: translateX(-50%); width: 340px; max-width: 90%; opacity: 0.55; pointer-events: none; z-index: 0; }
  .bg-track-svg { width: 100%; height: auto; }
  .landing-content { position: relative; z-index: 1; }
  .landing-fade { opacity: 0; transform: translateY(14px); animation: fadeSlideUp 0.6s ease forwards; }
  .landing-fade.d1 { animation-delay: 0.05s; }
  .landing-fade.d2 { animation-delay: 0.15s; }
  .landing-fade.d3 { animation-delay: 0.25s; }
  .landing-fade.d4 { animation-delay: 0.35s; }
  .landing-fade.d5 { animation-delay: 0.45s; }
  @keyframes fadeSlideUp { to { opacity: 1; transform: translateY(0); } }
  .landing .emblem { animation: emblemPulse 3.5s ease-in-out infinite; }
  @keyframes emblemPulse { 0%, 100% { filter: drop-shadow(0 0 0 rgba(227,166,47,0)); } 50% { filter: drop-shadow(0 0 10px rgba(227,166,47,0.35)); } }
  .live-ticker {
    display: inline-flex; align-items: center; gap: 10px; margin: 0 0 24px;
    padding: 9px 16px; background: rgba(31,156,140,0.12); border: 1px solid rgba(111,224,204,0.25); border-radius: 30px;
    font-size: 12.5px; font-weight: 600; color: #6FE0CC;
  }
  .live-ticker .dot { width: 6px; height: 6px; border-radius: 50%; background: #38C6B3; animation: dotBlink 1.6s ease-in-out infinite; }
  @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .live-ticker .num { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .landing-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--teal); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }

  /* ---------- Dark landing hero with embedded login card ---------- */
  .landing-dark {
    position: relative; overflow: hidden; text-align: left;
    padding: 26px 22px 36px;
    background: linear-gradient(165deg, #071A30, #0B2A4A 55%, #0d3d5c);
    color: var(--white);
    min-height: 100vh;
  }
  .ambient-glow {
    position: absolute; top: -80px; right: -90px; width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(31,156,140,0.42), transparent 68%);
    filter: blur(28px); pointer-events: none; z-index: 0;
  }
  .ambient-glow-2 {
    position: absolute; bottom: 12%; left: -110px; width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(227,166,47,0.16), transparent 70%);
    filter: blur(30px); pointer-events: none; z-index: 0;
  }
  .landing-dark .landing-content { position: relative; z-index: 1; }

  /* Brand row: logo tile + name */
  .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 46px; }
  .logo-tile {
    width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(145deg, #1F9C8C, #38C6B3);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(31,156,140,0.3);
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 0.03em; color: var(--white); text-transform: uppercase;
  }

  .hero-eyebrow {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700;
    color: #6FE0CC; text-transform: uppercase; letter-spacing: 0.22em; margin-bottom: 14px;
  }
  .hero-headline {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(34px, 9vw, 46px); line-height: 1.04; letter-spacing: -0.02em;
    margin: 0 0 18px; color: var(--white);
  }
  .hero-headline .accent-grad {
    background: linear-gradient(100deg, #6FE0CC, #A8F0E2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub-dark { color: #B4C4D4; font-size: 15px; margin: 0 0 10px; line-height: 1.55; }
  .hero-footnote { color: #6C8199; font-size: 12.5px; margin: 0 0 28px; }

  .quickstart-card {
    position: relative; text-align: left; margin: 0 0 18px; max-width: 460px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px; padding: 22px 20px 24px; overflow: hidden;
    backdrop-filter: blur(8px);
  }
  .card-top-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #38C6B3, var(--gold)); }
  .badge-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .pill-live {
    display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.06em; color: #6FE0CC; background: rgba(31,156,140,0.13);
    border: 1px solid rgba(111,224,204,0.28); border-radius: 22px; padding: 7px 14px;
  }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: #38C6B3; animation: dotBlink 1.6s ease-in-out infinite; }
  .secure-tag { font-size: 12px; color: #8FA3B8; }
  .step-indicator { display: flex; gap: 6px; margin-bottom: 20px; }
  .step-seg { flex: 1; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.09); }
  .step-seg.active { background: linear-gradient(90deg, #38C6B3, #6FE0CC); }
  .card-heading { font-family: 'Space Grotesk', sans-serif; font-size: 25px; font-weight: 700; color: var(--white); margin: 0 0 8px; letter-spacing: -0.01em; }
  .card-sub { font-size: 14px; color: #9DB0C2; margin: 0 0 20px; line-height: 1.5; }
  .field-dark { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .field-dark label { font-size: 12.5px; font-weight: 700; color: #C3D2E0; letter-spacing: 0.01em; }
  .field-dark input {
    font-family: 'Inter', sans-serif; font-size: 14.5px; padding: 11px 13px;
    border: 1.5px solid rgba(255,255,255,0.14); border-radius: 9px;
    color: var(--white); background: rgba(255,255,255,0.05); width: 100%;
  }
  .field-dark input::placeholder { color: #6C7E8F; }
  .field-dark input:focus { border-color: #38C6B3; }
  .input-wrap { position: relative; }
  .input-wrap input { padding-right: 42px; }
  .input-icon {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    font-size: 15px; opacity: 0.55; pointer-events: none;
  }
  .cta-gradient {
    width: 100%; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px;
    padding: 14px 22px; border: none; border-radius: 11px; cursor: pointer;
    background: linear-gradient(95deg, #38C6B3, #1F9C8C 55%, #E3A62F);
    color: #06202E; letter-spacing: 0.01em;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .cta-gradient:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(31,156,140,0.32); filter: brightness(1.05); }
  .cta-gradient:active { transform: translateY(0) scale(0.985); }
  .cta-gradient:disabled { opacity: 0.6; cursor: default; transform: none; }
  .card-foot-link { display: block; text-align: right; margin-top: -4px; margin-bottom: 16px; font-size: 12.5px; font-weight: 600; color: #6FE0CC; background: none; border: none; cursor: pointer; padding: 0; }
  .card-foot-link:hover { text-decoration: underline; }
  .link-btn-dark { background: none; border: none; color: #A9BBCC; text-decoration: underline; font-size: 12.5px; cursor: pointer; padding: 0; }
  .link-btn-dark:hover { color: var(--white); }
  .landing-btn { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .landing-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(11,42,74,0.14); }
  .landing-btn:active { transform: translateY(0) scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    .landing-fade { opacity: 1; transform: none; animation: none; }
    .emblem { animation: none !important; }
    .live-ticker .dot { animation: none; }
  }
  .landing .emblem { margin: 0 auto 18px; }
  .landing h1 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; color: var(--navy); margin: 0 0 6px; }
  .landing p.sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 30px; }
  .landing-btn { display: block; width: 100%; max-width: 320px; margin: 0 auto 12px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; padding: 14px 20px; border-radius: 10px; cursor: pointer; border: none; }
  .landing-btn.primary { background: var(--navy); color: var(--white); }
  .landing-btn.primary:hover { background: var(--navy-deep); }
  .landing-btn.secondary { background: var(--white); color: var(--navy); border: 1.5px solid var(--line); }
  .landing-btn.secondary:hover { border-color: var(--navy); }

  .form-screen { padding: 36px 24px; max-width: 420px; margin: 0 auto; }
  .form-screen h2 { font-family: 'Space Grotesk', sans-serif; font-size: 19px; color: var(--navy); margin: 0 0 6px; }
  .form-screen p.sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 22px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  .field input { font-family: 'Inter', sans-serif; font-size: 15px; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--paper); width: 100%; }
  .field input:focus { border-color: var(--teal); }
  .submit-btn { margin-top: 8px; width: 100%; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; padding: 13px 22px; background: var(--navy); color: var(--white); border: none; border-radius: 10px; cursor: pointer; }
  .submit-btn:hover { background: var(--navy-deep); }
  .submit-btn:disabled { opacity: 0.6; }
  .ghost-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; padding: 9px 14px; background: none; border: 1.5px solid var(--line); border-radius: 8px; color: var(--ink); cursor: pointer; }
  .ghost-btn:hover { border-color: var(--navy); }
  .link-btn { background: none; border: none; color: var(--teal); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; }

  .confirm-msg { margin-top: 14px; padding: 12px 14px; background: var(--teal-light); border: 1px solid #BEE6DF; border-radius: 9px; color: #146B5F; font-size: 13px; font-weight: 600; }
  .error-msg { margin-top: 14px; padding: 12px 14px; background: var(--red-light); border: 1px solid #F3C6C6; border-radius: 9px; color: var(--red); font-size: 13px; font-weight: 600; }

  /* ---------- Category picker ---------- */
  .cat-grid { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 20px; }
  .cat-card { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--white); }
  .cat-card:hover { border-color: var(--teal); }
  .cat-card.selected { border-color: var(--teal); background: var(--teal-light); }
  .cat-card .cat-emoji { font-size: 22px; }
  .cat-card .cat-name { font-weight: 700; font-size: 14px; color: var(--navy); }
  .cat-card .cat-target { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13px; color: var(--teal); margin-left: auto; }
  .cat-card .cat-desc { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

  /* ---------- Stat cards ---------- */
  .stat-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 100px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
  .stat-card .num { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; color: var(--navy); }
  .stat-card .label { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }

  /* ---------- Personal target card ---------- */
  .target-card { background: var(--gold-light); border: 1px solid #F0DBA6; border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; }
  .target-card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .target-card .row .t1 { font-weight: 700; font-size: 13.5px; color: var(--navy); }
  .target-card .row .t2 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft); }
  .mini-track { height: 10px; border-radius: 6px; background: rgba(11,42,74,0.10); overflow: hidden; }
  .mini-track-fill { height: 100%; background: var(--teal); border-radius: 6px; transition: width 0.5s ease; }

  /* ---------- Leaderboard ---------- */
  .cat-filter-row { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .cat-filter-row button { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; padding: 7px 13px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--white); color: var(--ink-soft); cursor: pointer; }
  .cat-filter-row button.active { background: var(--navy); border-color: var(--navy); color: var(--white); }

  /* ---------- My Performance card ---------- */
  .perf-card {
    background: linear-gradient(180deg, #FDF6E7, var(--white));
    border: 1px solid #F0DBA6; border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 20px;
  }
  .perf-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  .perf-label { font-size: 11.5px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.09em; }
  .perf-cat { font-size: 12px; color: var(--ink-soft); }
  .perf-units { display: flex; gap: 8px; margin-bottom: 12px; }
  .perf-unit {
    flex: 1; background: var(--white); border: 1px solid var(--line);
    border-radius: 11px; padding: 11px 3px; text-align: center;
  }
  .perf-unit .v { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .perf-unit .l { font-size: 9px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 5px; line-height: 1.25; }
  .perf-nudge {
    background: var(--white); border: 1px solid var(--line); border-radius: 11px;
    padding: 12px 14px; font-size: 13.5px; color: var(--ink); line-height: 1.45;
  }
  .perf-nudge strong { color: #B8860B; }
  .perf-nudge.leading strong { color: #146B5F; }

  /* ---------- Strava connect card ---------- */
  .strava-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--white); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 15px 16px; margin-bottom: 22px;
  }
  .strava-card.connected { border-color: #BEE6DF; background: var(--teal-light); }
  .strava-icon {
    width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
    background: #FC4C02; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 18px; font-family: 'Space Grotesk', sans-serif;
  }
  .strava-card.connected .strava-icon { background: var(--teal); }
  .strava-body { flex: 1; min-width: 0; }
  .strava-title { font-weight: 700; font-size: 14px; color: var(--ink); }
  .strava-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }
  .strava-btn {
    flex-shrink: 0; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px;
    padding: 9px 14px; border-radius: 9px; border: none; cursor: pointer;
    background: #FC4C02; color: #fff;
  }
  .strava-btn:hover { filter: brightness(1.08); }
  .strava-btn.ghost { background: none; border: 1.5px solid #BEE6DF; color: #146B5F; }
  .strava-btn.ghost:hover { border-color: var(--teal); filter: none; }

  /* ---------- Countdown timer ---------- */
  .countdown-card {
    background: linear-gradient(180deg, #F4FBFA, var(--white));
    border: 1px solid #CBE8E2; border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 20px;
  }
  .countdown-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .countdown-label { font-size: 11.5px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.09em; }
  .countdown-ends { font-size: 12px; color: var(--ink-soft); }
  .countdown-units { display: flex; gap: 8px; margin-bottom: 14px; }
  .cd-unit {
    flex: 1; background: var(--white); border: 1px solid var(--line);
    border-radius: 11px; padding: 11px 4px; text-align: center;
  }

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const todayStr = () => new Date().toISOString().slice(0, 10);
  function initials(n) {
    const p = String(n || '').trim().split(/\s+/).filter(Boolean);
    if (!p.length) return '??';
    return p.length === 1 ? p[0].slice(0,2).toUpperCase() : (p[0][0] + p[p.length-1][0]).toUpperCase();
  }
  function emblem(size) {
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 100 100" class="emblem" aria-hidden="true">' +
      '<circle cx="50" cy="50" r="45" fill="#0B2A4A"/>' +

      '<path d="M44 40 L60 48 L50 56 L64 76 L54 80 L40 60 L28 68 L22 58 L38 48 Z" fill="#1F9C8C"/></svg>';
  }

  // ---------- Supabase ----------
  async function rpc(fn, args) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(args || {})
    });
    if (!res.ok) throw new Error('Request failed (' + res.status + ')');
    const t = await res.text();
    return t ? JSON.parse(t) : null;
  }

  const api = {
    checkAccount: id => rpc('check_account', { p_employee_id: id }),
    setInitialPassword: (id, pw) => rpc('set_initial_password', { p_employee_id: id, p_password: pw }),
    login: (id, pw) => rpc('login', { p_employee_id: id, p_password: pw }),
    logout: t => rpc('logout', { p_token: t }),
    whoami: t => rpc('whoami', { p_token: t }),
    standings: () => rpc('standings', {}),
    myGroup: t => rpc('my_group', { p_token: t }),
    addMember: (t, id, name) => rpc('leader_add_member', { p_token: t, p_employee_id: id, p_name: name }),
    logRun: (t, mid, date, km, mins) => rpc('leader_log_run', { p_token: t, p_member_id: mid, p_date: date, p_km: km, p_minutes: mins }),
    deleteEntry: (t, eid) => rpc('leader_delete_entry', { p_token: t, p_entry_id: eid }),
    adminData: p => rpc('admin_data', { p_passcode: p }),
    createLeader: (p, id, name, gid, pw) => rpc('admin_create_leader', { p_passcode: p, p_employee_id: id, p_name: name, p_group_id: gid, p_password: pw }),
    resetPassword: (p, id, pw) => rpc('admin_reset_password', { p_passcode: p, p_employee_id: id, p_password: pw }),
    moveMember: (p, id, gid) => rpc('admin_move_member', { p_passcode: p, p_employee_id: id, p_new_group_id: gid }),
    removeUser: (p, id) => rpc('admin_remove_user', { p_passcode: p, p_employee_id: id }),
    changePassword: (t, cur, nw) => rpc('change_my_password', { p_token: t, p_current: cur, p_new: nw })
  };

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));

  // ---------- Countdown ----------
  let cdTimer = null;
  const clearCd = () => { if (cdTimer) { clearInterval(cdTimer); cdTimer = null; } };
  const pad2 = n => String(n).padStart(2, '0');

  function computeCd(s) {
    if (!s || !s.endDate) return null;
    const end = new Date(s.endDate + 'T23:59:59');
    const start = s.startDate ? new Date(s.startDate + 'T00:00:00') : null;
    const now = new Date(), ms = end - now;
    const fmt = d => d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    if (start && now < start) return { notStarted: true, startLabel: fmt(start), endLabel: fmt(end), pct: 0 };
    let pct = 0;
    if (start) { const tot = end - start; pct = tot > 0 ? Math.max(0, Math.min(100, ((now - start) / tot) * 100)) : 0; }
    if (ms <= 0) return { ended: true, pct: 100, endLabel: fmt(end) };
    return { ended: false, pct: pct, endLabel: fmt(end),
      days: Math.floor(ms/86400000), hours: Math.floor((ms%86400000)/3600000),
      mins: Math.floor((ms%3600000)/60000), secs: Math.floor((ms%60000)/1000) };
  }

  function cdHtml(cd) {
    if (!cd) return '';
    if (cd.notStarted) {
      return '<div class="countdown-card"><div class="countdown-top"><span class="countdown-label">Starts Soon</span>' +
        '<span class="countdown-ends">Ends ' + esc(cd.endLabel) + '</span></div>' +
        '<div class="countdown-ended">🗓️ Challenge begins ' + esc(cd.startLabel) + '</div></div>';
    }
    if (cd.ended) {
      return '<div class="countdown-card"><div class="countdown-top"><span class="countdown-label">Challenge Complete</span>' +
        '<span class="countdown-ends">Ended ' + esc(cd.endLabel) + '</span></div>' +
        '<div class="countdown-ended">🏁 Final results are in</div>' +
        '<div class="cd-progress-track"><div class="cd-progress-fill" style="width:100%"></div></div></div>';
    }
    return '<div class="countdown-card"><div class="countdown-top"><span class="countdown-label">Time Remaining</span>' +
      '<span class="countdown-ends">Ends ' + esc(cd.endLabel) + '</span></div><div class="countdown-units">' +
      '<div class="cd-unit"><div class="v" id="cd-d">' + cd.days + '</div><div class="l">Days</div></div>' +
      '<div class="cd-unit"><div class="v" id="cd-h">' + pad2(cd.hours) + '</div><div class="l">Hours</div></div>' +
      '<div class="cd-unit"><div class="v" id="cd-m">' + pad2(cd.mins) + '</div><div class="l">Mins</div></div>' +
      '<div class="cd-unit"><div class="v" id="cd-s">' + pad2(cd.secs) + '</div><div class="l">Secs</div></div></div>' +
      '<div class="cd-progress-track"><div class="cd-progress-fill" id="cd-fill" style="width:' + cd.pct + '%"></div>' +
      '<div class="cd-progress-dot" id="cd-dot" style="left:' + cd.pct + '%"></div></div></div>';
  }

  function startCd(s) {
    clearCd();
    if (!s || !s.endDate) return;
    cdTimer = setInterval(function () {
      const cd = computeCd(s), el = document.getElementById('cd-d');
      if (!el || !cd || cd.ended || cd.notStarted) { clearCd(); return; }
      el.textContent = cd.days;
      document.getElementById('cd-h').textContent = pad2(cd.hours);
      document.getElementById('cd-m').textContent = pad2(cd.mins);
      document.getElementById('cd-s').textContent = pad2(cd.secs);
      const f = document.getElementById('cd-fill'), d = document.getElementById('cd-dot');
      if (f) f.style.width = cd.pct + '%';
      if (d) d.style.left = cd.pct + '%';
    }, 1000);
  }

  // ---------- Boot ----------
  async function init() {
    if (state.token) {
      try {

      } catch (e) {}
      clearToken(); state.token = null;
    }
    render();
  }

  async function goToTab(tab) {
    clearCd();
    state.appTab = tab;
    state.loading = true;
    render();
    try {
      state.standings = await api.standings();
      if (tab === 'manage' && state.token) state.myGroup = await api.myGroup(state.token);
    } catch (e) { state.standings = null; }
    state.loading = false;
    render();
  }

  function render() {
    if (state.view === 'login') return renderLogin();

    const s = state.standings;
    if (!s) { p.innerHTML = '<div class="empty-state">Could not load stats right now.</div>'; return; }

    const myGroup = s.groups.find(g => g.id === state.profile.groupId);
    const me = myGroup ? myGroup.members.find(m => m.employeeId === state.profile.employeeId) : null;
    const myKm = me ? me.km : 0;
    const myPct = Math.min(100, (myKm / s.perPersonTargetKm) * 100);
    const left = Math.max(0, s.perPersonTargetKm - myKm);
    const rank = s.groups.findIndex(g => g.id === state.profile.groupId) + 1;

    p.innerHTML = cdHtml(computeCd(s)) +
      '<div class="target-card"><div class="row"><span class="t1">Your ' + s.perPersonTargetKm + ' km target</span>' +
      '<span class="t2">' + myKm.toFixed(1) + ' / ' + s.perPersonTargetKm + ' km</span></div>' +
      '<div class="mini-track"><div class="mini-track-fill" style="width:' + myPct + '%"></div></div>' +
      '<div class="target-note">' + (left > 0
        ? '🏃 ' + left.toFixed(1) + ' km to go — you are ' + Math.round(myPct) + '% there.'
        : '🎉 Target complete! Extra km still push ' + esc(myGroup ? myGroup.name : 'your group') + ' up the board.') +
      '</div></div>' +
      '<div class="stat-strip">' +
      '<div class="stat-cell"><div class="num">#' + rank + '</div><div class="label">Group rank</div></div>' +
      '<div class="stat-cell"><div class="num">' + (myGroup ? myGroup.membersHitTarget : 0) + '</div><div class="label">Hit 50 km</div></div>' +
      '<div class="stat-cell"><div class="num">' + (myGroup ? myGroup.memberCount : 0) + '</div><div class="label">Members</div></div></div>' +
      todayCardHtml(s) + topRunnersHtml(s) +
      '<div class="board-title">' + esc(myGroup ? myGroup.name : 'Your group') + ' — Member Progress</div>' +
      (myGroup && myGroup.members.length
        ? '<div class="member-list standalone">' + myGroup.members.map(memberRowHtml).join('') + '</div>'
        : '<div class="empty-state">No members in your group yet.</div>') +
      (state.profile.role === 'member'
        ? '<div class="readonly-note">📋 Your group leader records everyone\'s kilometres. Pass your runs to them each week.</div>'
        : '') +
      '<div class="admin-section" style="margin-top:26px;"><h4>Change your password</h4>' +
      '<div class="admin-config-grid">' +
      '<div class="field"><label>Current password</label><input id="cp-cur" type="password" autocomplete="current-password" /></div>' +
      '<div class="field"><label>New password</label><input id="cp-new" type="password" placeholder="min 6 characters" autocomplete="new-password" /></div></div>' +
      '<button class="submit-btn" id="cp-save" style="max-width:220px;margin-top:12px;">Update password</button>' +
      '<div id="cp-status"></div></div>';

    p.querySelector('#cp-save').addEventListener('click', async function () {
      const cur = p.querySelector('#cp-cur').value, nw = p.querySelector('#cp-new').value;
      const st = p.querySelector('#cp-status'), btn = p.querySelector('#cp-save');
      if (!cur || !nw) { st.innerHTML = '<div class="error-msg">Fill in both fields.</div>'; return; }
      if (nw.length < 6) { st.innerHTML = '<div class="error-msg">New password must be at least 6 characters.</div>'; return; }
      btn.disabled = true; btn.textContent = 'Updating…';
      try {
        const r = await api.changePassword(state.token, cur, nw);
        if (r && r.success) {
          st.innerHTML = '<div class="confirm-msg">Password updated.</div>';
          p.querySelector('#cp-cur').value = ''; p.querySelector('#cp-new').value = '';
        } else {
          st.innerHTML = '<div class="error-msg">' + esc(r ? r.error : 'Could not update.') + '</div>';
        }
      } catch (e) { st.innerHTML = '<div class="error-msg">Could not reach the server.</div>'; }
      btn.disabled = false; btn.textContent = 'Update password';
    });

    startCd(s);
  }

  // ---------- All groups ----------
  function renderGroups(p) {
    if (state.loading) { p.innerHTML = '<div class="loading-state">Loading groups…</div>'; return; }
    const s = state.standings;
    if (!s) { p.innerHTML = '<div class="empty-state">Could not load the leaderboard.</div>'; return; }
    p.innerHTML =
      '<div class="board-header"><span class="live-pill"><span class="dot"></span>LIVE LEADERBOARD</span>' +
      '<h2 class="board-h1">Group scoreboard</h2>' +
      '<p class="board-h1-sub">Ranked by total kilometres · 500 km per group</p></div>' +
      todayCardHtml(s) + topRunnersHtml(s) +
      '<div class="tap-hint">Tap a group to see its members</div>' + groupRowsHtml(s);
    wireGroupRows(p);
  }

  // ---------- Leader: manage team ----------
  function renderManage(p) {
    if (state.loading) { p.innerHTML = '<div class="loading-state">Loading your team…</div>'; return; }
    const g = state.myGroup;
    if (!g || g.error) { p.innerHTML = '<div class="empty-state">Could not load your team.</div>'; return; }
    const full = g.members.length >= g.maxGroupSize;

    p.innerHTML =
      '<div class="admin-section"><h4>Record kilometres</h4>' +
      '<p class="section-hint">Enter what each member ran. Only your own group appears here.</p>' +
      '<div class="field"><label for="r-member">Member</label><select id="r-member">' +
      g.members.map(m => '<option value="' + esc(m.employeeId) + '">' + esc(m.name) + (m.role==='leader'?' (you)':'') + '</option>').join('') +
      '</select></div><div class="admin-config-grid">' +
      '<div class="field"><label for="r-date">Date</label><input id="r-date" type="date" value="' + todayStr() + '" min="2026-09-15" max="2026-10-15" /></div>' +
      '<div class="field"><label for="r-km">Distance (km)</label><input id="r-km" type="number" step="0.1" min="0.1" max="200" placeholder="12.5" /></div></div>' +
      '<button class="submit-btn" id="r-save" style="max-width:220px;margin-top:12px;">Record run</button><div id="r-status"></div></div>' +

      '<div class="admin-section"><h4>Your team (' + g.members.length + '/' + g.maxGroupSize + ')</h4>' +
      '<div class="table-wrap"><table class="admin-table"><tr><th>Name</th><th>ID</th><th>km</th><th>Login</th></tr>' +
      g.members.map(m => '<tr><td>' + esc(m.name) + (m.role==='leader'?' <span class="lead-tag">LEADER</span>':'') + '</td>' +
        '<td class="mono">' + esc(m.employeeId) + '</td><td><strong>' + Number(m.km).toFixed(1) + '</strong></td>' +
        '<td>' + (m.hasPassword ? '<span style="color:#1F9C8C">✓ active</span>' : '<span style="color:#8A6110">pending</span>') + '</td></tr>').join('') +
      '</table></div></div>' +

      '<div class="admin-section"><h4>Add a member</h4>' +
      (full ? '<div class="error-msg">Your group is full (10 members).</div>'
        : '<p class="section-hint">They will set their own password the first time they sign in.</p>' +
          '<div class="admin-config-grid">' +
          '<div class="field"><label for="a-id">Employee ID</label><input id="a-id" type="text" placeholder="BRCM10234" /></div>' +
          '<div class="field"><label for="a-name">Name</label><input id="a-name" type="text" placeholder="Full name" /></div></div>' +
          '<button class="submit-btn" id="a-save" style="max-width:220px;margin-top:12px;">Add member</button><div id="a-status"></div>') +
      '</div>' +

      '<div class="admin-section"><h4>Recent entries</h4>' +
      (!g.entries.length ? '<div class="empty-state">Nothing recorded yet.</div>'
        : '<div class="table-wrap"><table class="admin-table"><tr><th>Date</th><th>Member</th><th>km</th><th></th></tr>' +
          g.entries.slice(0, 30).map(e => '<tr><td class="mono">' + esc(e.date) + '</td><td>' + esc(e.name) + '</td>' +
            '<td>' + Number(e.km).toFixed(1) + '</td><td><button class="ghost-btn del-entry" data-id="' + e.id +
            '" style="padding:4px 9px;font-size:11px;">Remove</button></td></tr>').join('') + '</table></div>') +
      '</div>';

    p.querySelector('#r-save').addEventListener('click', async function () {
      const mid = p.querySelector('#r-member').value;
      const date = p.querySelector('#r-date').value;
      const km = parseFloat(p.querySelector('#r-km').value);
      const st = p.querySelector('#r-status'), btn = p.querySelector('#r-save');
      if (!date || !km || km <= 0) { st.innerHTML = '<div class="error-msg">Enter a date and a distance above 0.</div>'; return; }
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const r = await api.logRun(state.token, mid, date, km, 0);
        if (r && r.success) { await goToTab('manage'); }
        else { st.innerHTML = '<div class="error-msg">' + esc(r ? r.error : 'Could not save.') + '</div>'; btn.disabled = false; btn.textContent = 'Record run'; }
      } catch (e) { st.innerHTML = '<div class="error-msg">Could not reach the server.</div>'; btn.disabled = false; btn.textContent = 'Record run'; }
    });

    const addBtn = p.querySelector('#a-save');
    if (addBtn) addBtn.addEventListener('click', async function () {
      const id = p.querySelector('#a-id').value.trim();
      const name = p.querySelector('#a-name').value.trim();
      const st = p.querySelector('#a-status');
      if (!id || !name) { st.innerHTML = '<div class="error-msg">Both Employee ID and name are required.</div>'; return; }
      addBtn.disabled = true; addBtn.textContent = 'Adding…';
      try {
        const r = await api.addMember(state.token, id, name);
        if (r && r.success) { await goToTab('manage'); }
        else { st.innerHTML = '<div class="error-msg">' + esc(r ? r.error : 'Could not add.') + '</div>'; addBtn.disabled = false; addBtn.textContent = 'Add member'; }
      } catch (e) { st.innerHTML = '<div class="error-msg">Could not reach the server.</div>'; addBtn.disabled = false; addBtn.textContent = 'Add member'; }
    });

    p.querySelectorAll('.del-entry').forEach(function (b) {
      b.addEventListener('click', async function () {
        if (!confirm('Remove this entry?')) return;
        b.disabled = true; b.textContent = '…';
        try { await api.deleteEntry(state.token, Number(b.dataset.id)); await goToTab('manage'); }
        catch (e) { b.disabled = false; b.textContent = 'Remove'; }
      });
    });
  }

  // ---------- Admin ----------
  function renderAdmin(p) {
    if (!state.adminData || !state.adminData.authorized) {
      p.innerHTML = '<div class="admin-gate"><div class="board-title">Admin Access</div>' +
        '<div class="field"><label for="ap">Passcode</label><input id="ap" type="password" placeholder="Admin passcode" /></div>' +
        '<button class="submit-btn" id="unlock">Unlock</button><div id="gs"></div></div>';
      const go = async function () {
        const pass = p.querySelector('#ap').value, st = p.querySelector('#gs');
        try {
          const r = await api.adminData(pass);
          if (r && r.authorized) { state.adminData = r; sessionStorage.setItem(ADMIN_KEY, pass); renderAdmin(p); }
          else st.innerHTML = '<div class="error-msg">Incorrect passcode.</div>';
        } catch (e) { st.innerHTML = '<div class="error-msg">Could not reach the server.</div>'; }
      };
      p.querySelector('#unlock').addEventListener('click', go);
      p.querySelector('#ap').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
      return;
    }

    const d = state.adminData;
    const noLeader = d.groups.filter(g => !g.leader);
    p.innerHTML =
      '<div class="stat-row">' +
      '<div class="stat-card"><div class="num display">' + d.totalUsers + '</div><div class="label">Registered</div></div>' +
      '<div class="stat-card"><div class="num display">' + d.totalEntries + '</div><div class="label">Entries</div></div>' +
      '<div class="stat-card"><div class="num display">' + d.allTimeKm.toFixed(1) + '</div><div class="label">Total km</div></div></div>' +

      '<div class="admin-section"><h4>Create a group leader</h4>' +
      '<p class="section-hint">Leaders add their own members and record their team\'s kilometres.</p>' +
      '<div class="admin-config-grid">' +
      '<div class="field"><label>Employee ID</label><input id="nl-id" type="text" placeholder="BRCM10234" /></div>' +
      '<div class="field"><label>Name</label><input id="nl-name" type="text" placeholder="Full name" /></div>' +
      '<div class="field"><label>Group</label><select id="nl-group">' +
      d.groups.map(g => '<option value="' + g.id + '"' + (g.leader ? ' disabled' : '') + '>' + esc(g.name) +
        (g.leader ? ' — has ' + esc(g.leader) : '') + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Password (leave blank to auto-generate)</label><input id="nl-pw" type="text" placeholder="auto-generate" /></div></div>' +
      '<button class="submit-btn" id="nl-save" style="max-width:220px;margin-top:12px;">Create leader</button>' +
      '<div id="nl-status"></div>' +
      (noLeader.length ? '<div class="section-hint" style="margin-top:10px;">Still without a leader: ' +
        noLeader.map(g => esc(g.name)).join(', ') + '</div>' : '') + '</div>' +

      '<div class="admin-section"><h4>Groups</h4><div class="table-wrap"><table class="admin-table">' +
      '<tr><th>Group</th><th>Leader</th><th>Members</th></tr>' +
      d.groups.map(g => '<tr><td>' + esc(g.name) + '</td><td>' +
        (g.leader ? esc(g.leader) : '<em style="color:#A32E2E">none</em>') + '</td><td>' + g.memberCount + '</td></tr>').join('') +
      '</table></div></div>' +

      '<div class="admin-section"><h4>All users (' + d.users.length + ')</h4><div class="table-wrap"><table class="admin-table">' +
      '<tr><th>ID</th><th>Name</th><th>Role</th><th>Group</th><th>Start password</th></tr>' +
      d.users.map(u => '<tr><td class="mono">' + esc(u.employeeId) + '</td><td>' + esc(u.name) + '</td><td>' +
        (u.role === 'leader' ? '<strong>Leader</strong>' : 'Member') + '</td><td>' + esc(u.groupName || '—') + '</td><td>' +
        (u.startPassword
          ? '<code class="pw-chip">' + esc(u.startPassword) + '</code>'
          : (u.hasPassword ? '<span style="color:#1F9C8C">own password set</span>' : '<span style="color:#8A6110">not signed in yet</span>')) +
        '</td></tr>').join('') + '</table></div>' +
      '<p class="section-hint" style="margin-top:8px;">Starting passwords show until the person sets their own. After that they are private — use Reset below.</p></div>' +

      '<div class="admin-section"><h4>Move a member to another group</h4>' +
      '<p class="section-hint">Their logged kilometres move with them. Leaders cannot be moved — remove or replace them instead.</p>' +
      '<div class="admin-config-grid">' +
      '<div class="field"><label>Member</label><select id="mv-id">' +
      d.users.filter(u => u.role !== 'leader').map(u => '<option value="' + esc(u.employeeId) + '">' +
        esc(u.name) + ' — ' + esc(u.groupName || 'no group') + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Move to</label><select id="mv-group">' +
      d.groups.map(g => '<option value="' + g.id + '">' + esc(g.name) + ' (' + g.memberCount + '/10)</option>').join('') +
      '</select></div></div>' +
      '<button class="submit-btn" id="mv-save" style="max-width:220px;margin-top:12px;">Move member</button>' +
      '<div id="mv-status"></div></div>' +

      '<div class="admin-section"><h4>Remove someone</h4>' +
      '<p class="section-hint">Deletes the person and every run recorded for them. This cannot be undone.</p>' +
      '<div class="field" style="max-width:320px;"><label>Employee ID</label><input id="rm-id" type="text" placeholder="BRCM10234" /></div>' +
      '<button class="submit-btn" id="rm-save" style="max-width:220px;margin-top:12px;background:#A32E2E;">Remove permanently</button>' +
      '<div id="rm-status"></div></div>' +

      '<div class="admin-section"><h4>Reset a password</h4><div class="admin-config-grid">' +
      '<div class="field"><label>Employee ID</label><input id="rp-id" type="text" placeholder="BRCM10234" /></div>' +
      '<div class="field"><label>New password (blank = auto-generate)</label><input id="rp-pw" type="text" placeholder="auto-generate" /></div></div>' +
      '<button class="submit-btn" id="rp-save" style="max-width:220px;margin-top:12px;">Reset password</button>' +
      '<div id="rp-status"></div></div>' +

      '<button class="ghost-btn" id="csv">Download all entries as CSV</button>';

    p.querySelector('#nl-save').addEventListener('click', async function () {
      const pass = sessionStorage.getItem(ADMIN_KEY), st = p.querySelector('#nl-status');
      const btn = p.querySelector('#nl-save'); btn.disabled = true; btn.textContent = 'Creating…';
      try {
        const r = await api.createLeader(pass, p.querySelector('#nl-id').value.trim(),
          p.querySelector('#nl-name').value.trim(), Number(p.querySelector('#nl-group').value),
          p.querySelector('#nl-pw').value);
        if (r && r.success) {
          const msg = esc(r.message || 'Leader created.');
          state.adminData = await api.adminData(pass);
          renderAdmin(p);
          const s2 = p.querySelector('#nl-status');
          if (s2) s2.innerHTML = '<div class="confirm-msg">✅ ' + msg + '<br><small>Copy this now — send it to them.</small></div>';
        } else {
          st.innerHTML = '<div class="error-msg">' + esc(r ? r.error : 'Failed.') + '</div>';
          btn.disabled = false; btn.textContent = 'Create leader';
        }
      } catch (e) {
        st.innerHTML = '<div class="error-msg">Could not reach the server.</div>';
        btn.disabled = false; btn.textContent = 'Create leader';
      }
    });

    p.querySelector('#rp-save').addEventListener('click', async function () {
      const pass = sessionStorage.getItem(ADMIN_KEY), st = p.querySelector('#rp-status');
      const btn = p.querySelector('#rp-save'); btn.disabled = true; btn.textContent = 'Resetting…';
      try {
        const r = await api.resetPassword(pass, p.querySelector('#rp-id').value.trim(), p.querySelector('#rp-pw').value);
        if (r && r.success) {
          const pass2 = sessionStorage.getItem(ADMIN_KEY);
          const msg = esc(r.message || 'Password reset.');
          state.adminData = await api.adminData(pass2);
          renderAdmin(p);
          const s3 = p.querySelector('#rp-status');
          if (s3) s3.innerHTML = '<div class="confirm-msg">✅ ' + msg + '<br><small>They are signed out everywhere until they use it.</small></div>';
          return;
        }
        st.innerHTML = '<div class="error-msg">' + esc(r ? r.error : 'Failed.') + '</div>';
      } catch (e) { st.innerHTML = '<div class="error-msg">Could not reach the server.</div>'; }
      btn.disabled = false; btn.textContent = 'Reset password';
    });

    p.querySelector('#mv-save').addEventListener('click', async function () {
      const pass = sessionStorage.getItem(ADMIN_KEY), st = p.querySelector('#mv-status');
      const sel = p.querySelector('#mv-id');
      if (!sel || !sel.value) { st.innerHTML = '<div class="error-msg">No members to move yet.</div>'; return; }
      const btn = p.querySelector('#mv-save'); btn.disabled = true; btn.textContent = 'Moving…';
      try {
        const r = await api.moveMember(pass, sel.value, Number(p.querySelector('#mv-group').value));
        if (r && r.success) {
          state.adminData = await api.adminData(pass);
          renderAdmin(p);
          const s2 = p.querySelector('#mv-status');
          if (s2) s2.innerHTML = '<div class="confirm-msg">' + esc(r.message) + '</div>';
        } else {
          st.innerHTML = '<div class="error-msg">' + esc(r ? r.error : 'Failed.') + '</div>';
          btn.disabled = false; btn.textContent = 'Move member';
        }
      } catch (e) {
        st.innerHTML = '<div class="error-msg">Could not reach the server.</div>';
        btn.disabled = false; btn.textContent = 'Move member';
      }
    });

    p.querySelector('#rm-save').addEventListener('click', async function () {
      const id = p.querySelector('#rm-id').value.trim();
      const st = p.querySelector('#rm-status');
      if (!id) { st.innerHTML = '<div class="error-msg">Enter an Employee ID.</div>'; return; }
      if (!confirm('Permanently remove ' + id + ' and all their recorded runs? This cannot be undone.')) return;
      const pass = sessionStorage.getItem(ADMIN_KEY);
      const btn = p.querySelector('#rm-save'); btn.disabled = true; btn.textContent = 'Removing…';
      try {
        const r = await api.removeUser(pass, id);
        if (r && r.success) {
          state.adminData = await api.adminData(pass);
          renderAdmin(p);
          const s2 = p.querySelector('#rm-status');
          if (s2) s2.innerHTML = '<div class="confirm-msg">' + esc(r.message) + '</div>';
        } else {
          st.innerHTML = '<div class="error-msg">' + esc(r ? r.error : 'Failed.') + '</div>';
          btn.disabled = false; btn.textContent = 'Remove permanently';
        }
      } catch (e) {
        st.innerHTML = '<div class="error-msg">Could not reach the server.</div>';
        btn.disabled = false; btn.textContent = 'Remove permanently';
      }
    });

    p.querySelector('#csv').addEventListener('click', function () {
      const rows = [['EmployeeID','Name','Group','Date','km','EnteredBy']];
      d.entries.forEach(e => rows.push([e.employeeId, e.name, e.groupName || '', e.date, e.km, e.enteredBy || '']));
      const csv = rows.map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"').join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      const a = document.createElement('a'); a.href = url; a.download = 'running-challenge.csv'; a.click();
      URL.revokeObjectURL(url);
    });
  }

  init();
})();

</script>
</body>
</html>
