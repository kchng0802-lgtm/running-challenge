<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Broadcom Running Challenge</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0B2A4A" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Run Challenge" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; color: #16202B; background: #E9EBEE; }

  .app {
    --navy: #0B2A4A; --navy-deep: #071A30; --teal: #1F9C8C; --teal-light: #E4F5F2;
    --gold: #E3A62F; --gold-light: #FBF0DA; --paper: #F7F5F0; --ink: #16202B;
    --ink-soft: #5B6B7A; --line: #E2E1DA; --white: #FFFFFF; --red: #A32E2E; --red-light: #FDEDED;
    max-width: 680px; margin: 0 auto; background: var(--paper); min-height: 100vh;
    box-shadow: 0 0 50px rgba(0,0,0,0.08);
  }
  .display { font-family: 'Space Grotesk', sans-serif; }
  .mono { font-family: 'IBM Plex Mono', monospace; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- Brand header ---------- */
  .brandbar {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 20px; background: var(--white); border-bottom: 1px solid var(--line);
  }
  .brandbar .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: var(--navy); letter-spacing: 0.02em; }
  .brandbar .wordmark small { display: block; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 10px; color: var(--ink-soft); letter-spacing: 0.04em; text-transform: uppercase; }
  .brandbar .spacer { flex: 1; }
  .brandbar .top-link { font-size: 12px; color: var(--ink-soft); text-decoration: none; font-weight: 600; }
  .brandbar .top-link:hover { color: var(--navy); }

  /* ---------- Hero ---------- */
  .hero { background: linear-gradient(160deg, var(--navy-deep), var(--navy)); color: var(--white); padding: 26px 22px 20px; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .hero-title { font-size: 19px; font-weight: 700; }
  .hero-sub { color: #A9BBCC; font-size: 12px; margin-top: 4px; }
  .hero-stat { text-align: right; }
  .hero-stat .num { font-size: 26px; font-weight: 700; color: var(--gold); line-height: 1; }
  .hero-stat .label { font-size: 10.5px; color: #A9BBCC; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 3px; }
  .track-wrap { margin-top: 18px; }
  .track { height: 30px; border-radius: 15px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14); position: relative; overflow: hidden; }
  .track::before { content: ''; position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(255,255,255,0.10) 20px, rgba(255,255,255,0.10) 24px); }
  .track-fill { height: 100%; background: linear-gradient(90deg, var(--teal), #38C6B3); border-radius: 15px; transition: width 0.6s ease; min-width: 30px; }
  .track-runner { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 16px; transition: left 0.6s ease; }
  .track-labels { display: flex; justify-content: space-between; font-size: 10px; color: #8FA3B8; margin-top: 6px; font-family: 'IBM Plex Mono', monospace; }
  .profile-chip { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: #A9BBCC; flex-wrap: wrap; }
  .cat-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.03em; }
  .cat-badge.Beginner { background: #E4F5F2; color: #146B5F; }
  .cat-badge.Intermediate { background: #FBF0DA; color: #8A6110; }
  .cat-badge.Expert { background: #FDEDED; color: #A32E2E; }
  .profile-chip button { background: none; border: none; color: #A9BBCC; text-decoration: underline; font-size: 11px; cursor: pointer; padding: 0; }
  .profile-chip button:hover { color: var(--white); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; padding: 8px 14px 0; background: var(--white); border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; padding: 12px 13px; background: none; border: none; color: var(--ink-soft); cursor: pointer; border-bottom: 2.5px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--gold); }
  .panel { padding: 20px 20px 30px; background: var(--white); min-height: 320px; }

  /* ---------- Landing / Login / Register ---------- */
  .landing { padding: 50px 26px; text-align: center; position: relative; overflow: hidden; }
  .bg-track { position: absolute; top: 8%; left: 50%; transform: translateX(-50%); width: 340px; max-width: 90%; opacity: 0.55; pointer-events: none; z-index: 0; }
  .bg-track-svg { width: 100%; height: auto; }
  .landing-content { position: relative; z-index: 1; }
  .landing-fade { opacity: 0; transform: translateY(14px); animation: fadeSlideUp 0.6s ease forwards; }
  .landing-fade.d1 { animation-delay: 0.05s; }
  .landing-fade.d2 { animation-delay: 0.15s; }
  .landing-fade.d3 { animation-delay: 0.25s; }
  .landing-fade.d4 { animation-delay: 0.35s; }
  .landing-fade.d5 { animation-delay: 0.45s; }
  @keyframes fadeSlideUp { to { opacity: 1; transform: translateY(0); } }
  .landing .emblem { animation: emblemPulse 3.5s ease-in-out infinite; }
  @keyframes emblemPulse { 0%, 100% { filter: drop-shadow(0 0 0 rgba(227,166,47,0)); } 50% { filter: drop-shadow(0 0 10px rgba(227,166,47,0.35)); } }
  .live-ticker {
    display: inline-flex; align-items: center; gap: 10px; margin: 0 0 24px;
    padding: 9px 16px; background: rgba(31,156,140,0.12); border: 1px solid rgba(111,224,204,0.25); border-radius: 30px;
    font-size: 12.5px; font-weight: 600; color: #6FE0CC;
  }
  .live-ticker .dot { width: 6px; height: 6px; border-radius: 50%; background: #38C6B3; animation: dotBlink 1.6s ease-in-out infinite; }
  @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .live-ticker .num { font-family: 'IBM Plex Mono', monospace; font-weight: 700; }
  .landing-eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; color: var(--teal); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }

  /* ---------- Dark landing hero with embedded login card ---------- */
  .landing-dark {
    position: relative; overflow: hidden; text-align: left;
    padding: 26px 22px 36px;
    background: linear-gradient(165deg, #071A30, #0B2A4A 55%, #0d3d5c);
    color: var(--white);
    min-height: 100vh;
  }
  .ambient-glow {
    position: absolute; top: -80px; right: -90px; width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(31,156,140,0.42), transparent 68%);
    filter: blur(28px); pointer-events: none; z-index: 0;
  }
  .ambient-glow-2 {
    position: absolute; bottom: 12%; left: -110px; width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(227,166,47,0.16), transparent 70%);
    filter: blur(30px); pointer-events: none; z-index: 0;
  }
  .landing-dark .landing-content { position: relative; z-index: 1; }

  /* Brand row: logo tile + name */
  .brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 46px; }
  .logo-tile {
    width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
    background: linear-gradient(145deg, #1F9C8C, #38C6B3);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(31,156,140,0.3);
  }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px;
    letter-spacing: 0.03em; color: var(--white); text-transform: uppercase;
  }

  .hero-eyebrow {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700;
    color: #6FE0CC; text-transform: uppercase; letter-spacing: 0.22em; margin-bottom: 14px;
  }
  .hero-headline {
    font-family: 'Space Grotesk', sans-serif; font-weight: 700;
    font-size: clamp(34px, 9vw, 46px); line-height: 1.04; letter-spacing: -0.02em;
    margin: 0 0 18px; color: var(--white);
  }
  .hero-headline .accent-grad {
    background: linear-gradient(100deg, #6FE0CC, #A8F0E2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub-dark { color: #B4C4D4; font-size: 15px; margin: 0 0 10px; line-height: 1.55; }
  .hero-footnote { color: #6C8199; font-size: 12.5px; margin: 0 0 28px; }

  .quickstart-card {
    position: relative; text-align: left; margin: 0 0 18px; max-width: 460px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px; padding: 22px 20px 24px; overflow: hidden;
    backdrop-filter: blur(8px);
  }
  .card-top-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #38C6B3, var(--gold)); }
  .badge-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; flex-wrap: wrap; gap: 8px; }
  .pill-live {
    display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 700;
    letter-spacing: 0.06em; color: #6FE0CC; background: rgba(31,156,140,0.13);
    border: 1px solid rgba(111,224,204,0.28); border-radius: 22px; padding: 7px 14px;
  }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: #38C6B3; animation: dotBlink 1.6s ease-in-out infinite; }
  .secure-tag { font-size: 12px; color: #8FA3B8; }
  .step-indicator { display: flex; gap: 6px; margin-bottom: 20px; }
  .step-seg { flex: 1; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.09); }
  .step-seg.active { background: linear-gradient(90deg, #38C6B3, #6FE0CC); }
  .card-heading { font-family: 'Space Grotesk', sans-serif; font-size: 25px; font-weight: 700; color: var(--white); margin: 0 0 8px; letter-spacing: -0.01em; }
  .card-sub { font-size: 14px; color: #9DB0C2; margin: 0 0 20px; line-height: 1.5; }
  .field-dark { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
  .field-dark label { font-size: 12.5px; font-weight: 700; color: #C3D2E0; letter-spacing: 0.01em; }
  .field-dark input {
    font-family: 'Inter', sans-serif; font-size: 14.5px; padding: 11px 13px;
    border: 1.5px solid rgba(255,255,255,0.14); border-radius: 9px;
    color: var(--white); background: rgba(255,255,255,0.05); width: 100%;
  }
  .field-dark input::placeholder { color: #6C7E8F; }
  .field-dark input:focus { border-color: #38C6B3; }
  .input-wrap { position: relative; }
  .input-wrap input { padding-right: 42px; }
  .input-icon {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    font-size: 15px; opacity: 0.55; pointer-events: none;
  }
  .cta-gradient {
    width: 100%; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 15px;
    padding: 14px 22px; border: none; border-radius: 11px; cursor: pointer;
    background: linear-gradient(95deg, #38C6B3, #1F9C8C 55%, #E3A62F);
    color: #06202E; letter-spacing: 0.01em;
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }
  .cta-gradient:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(31,156,140,0.32); filter: brightness(1.05); }
  .cta-gradient:active { transform: translateY(0) scale(0.985); }
  .cta-gradient:disabled { opacity: 0.6; cursor: default; transform: none; }
  .card-foot-link { display: block; text-align: right; margin-top: -4px; margin-bottom: 16px; font-size: 12.5px; font-weight: 600; color: #6FE0CC; background: none; border: none; cursor: pointer; padding: 0; }
  .card-foot-link:hover { text-decoration: underline; }
  .link-btn-dark { background: none; border: none; color: #A9BBCC; text-decoration: underline; font-size: 12.5px; cursor: pointer; padding: 0; }
  .link-btn-dark:hover { color: var(--white); }
  .landing-btn { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .landing-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(11,42,74,0.14); }
  .landing-btn:active { transform: translateY(0) scale(0.97); }
  @media (prefers-reduced-motion: reduce) {
    .landing-fade { opacity: 1; transform: none; animation: none; }
    .emblem { animation: none !important; }
    .live-ticker .dot { animation: none; }
  }
  .landing .emblem { margin: 0 auto 18px; }
  .landing h1 { font-family: 'Space Grotesk', sans-serif; font-size: 24px; color: var(--navy); margin: 0 0 6px; }
  .landing p.sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 30px; }
  .landing-btn { display: block; width: 100%; max-width: 320px; margin: 0 auto 12px; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; padding: 14px 20px; border-radius: 10px; cursor: pointer; border: none; }
  .landing-btn.primary { background: var(--navy); color: var(--white); }
  .landing-btn.primary:hover { background: var(--navy-deep); }
  .landing-btn.secondary { background: var(--white); color: var(--navy); border: 1.5px solid var(--line); }
  .landing-btn.secondary:hover { border-color: var(--navy); }

  .form-screen { padding: 36px 24px; max-width: 420px; margin: 0 auto; }
  .form-screen h2 { font-family: 'Space Grotesk', sans-serif; font-size: 19px; color: var(--navy); margin: 0 0 6px; }
  .form-screen p.sub { color: var(--ink-soft); font-size: 13px; margin: 0 0 22px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .field label { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
  .field input { font-family: 'Inter', sans-serif; font-size: 15px; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--paper); width: 100%; }
  .field input:focus { border-color: var(--teal); }
  .submit-btn { margin-top: 8px; width: 100%; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14.5px; padding: 13px 22px; background: var(--navy); color: var(--white); border: none; border-radius: 10px; cursor: pointer; }
  .submit-btn:hover { background: var(--navy-deep); }
  .submit-btn:disabled { opacity: 0.6; }
  .ghost-btn { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12.5px; padding: 9px 14px; background: none; border: 1.5px solid var(--line); border-radius: 8px; color: var(--ink); cursor: pointer; }
  .ghost-btn:hover { border-color: var(--navy); }
  .link-btn { background: none; border: none; color: var(--teal); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: underline; padding: 0; }

  .confirm-msg { margin-top: 14px; padding: 12px 14px; background: var(--teal-light); border: 1px solid #BEE6DF; border-radius: 9px; color: #146B5F; font-size: 13px; font-weight: 600; }
  .error-msg { margin-top: 14px; padding: 12px 14px; background: var(--red-light); border: 1px solid #F3C6C6; border-radius: 9px; color: var(--red); font-size: 13px; font-weight: 600; }

  /* ---------- Category picker ---------- */
  .cat-grid { display: flex; flex-direction: column; gap: 10px; margin: 14px 0 20px; }
  .cat-card { display: flex; align-items: center; gap: 12px; padding: 14px 15px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; background: var(--white); }
  .cat-card:hover { border-color: var(--teal); }
  .cat-card.selected { border-color: var(--teal); background: var(--teal-light); }
  .cat-card .cat-emoji { font-size: 22px; }
  .cat-card .cat-name { font-weight: 700; font-size: 14px; color: var(--navy); }
  .cat-card .cat-target { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 13px; color: var(--teal); margin-left: auto; }
  .cat-card .cat-desc { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }

  /* ---------- Stat cards ---------- */
  .stat-row { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { flex: 1; min-width: 100px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
  .stat-card .num { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; color: var(--navy); }
  .stat-card .label { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }

  /* ---------- Personal target card ---------- */
  .target-card { background: var(--gold-light); border: 1px solid #F0DBA6; border-radius: 12px; padding: 16px 18px; margin-bottom: 22px; }
  .target-card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .target-card .row .t1 { font-weight: 700; font-size: 13.5px; color: var(--navy); }
  .target-card .row .t2 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink-soft); }
  .mini-track { height: 10px; border-radius: 6px; background: rgba(11,42,74,0.10); overflow: hidden; }
  .mini-track-fill { height: 100%; background: var(--teal); border-radius: 6px; transition: width 0.5s ease; }

  /* ---------- Leaderboard ---------- */
  .cat-filter-row { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .cat-filter-row button { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; padding: 7px 13px; border-radius: 20px; border: 1.5px solid var(--line); background: var(--white); color: var(--ink-soft); cursor: pointer; }
  .cat-filter-row button.active { background: var(--navy); border-color: var(--navy); color: var(--white); }

  /* ---------- My Performance card ---------- */
  .perf-card {
    background: linear-gradient(180deg, #FDF6E7, var(--white));
    border: 1px solid #F0DBA6; border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 20px;
  }
  .perf-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
  .perf-label { font-size: 11.5px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.09em; }
  .perf-cat { font-size: 12px; color: var(--ink-soft); }
  .perf-units { display: flex; gap: 8px; margin-bottom: 12px; }
  .perf-unit {
    flex: 1; background: var(--white); border: 1px solid var(--line);
    border-radius: 11px; padding: 11px 3px; text-align: center;
  }
  .perf-unit .v { font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .perf-unit .l { font-size: 9px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 5px; line-height: 1.25; }
  .perf-nudge {
    background: var(--white); border: 1px solid var(--line); border-radius: 11px;
    padding: 12px 14px; font-size: 13.5px; color: var(--ink); line-height: 1.45;
  }
  .perf-nudge strong { color: #B8860B; }
  .perf-nudge.leading strong { color: #146B5F; }

  /* ---------- Strava connect card ---------- */
  .strava-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--white); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 15px 16px; margin-bottom: 22px;
  }
  .strava-card.connected { border-color: #BEE6DF; background: var(--teal-light); }
  .strava-icon {
    width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
    background: #FC4C02; display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 18px; font-family: 'Space Grotesk', sans-serif;
  }
  .strava-card.connected .strava-icon { background: var(--teal); }
  .strava-body { flex: 1; min-width: 0; }
  .strava-title { font-weight: 700; font-size: 14px; color: var(--ink); }
  .strava-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.4; }
  .strava-btn {
    flex-shrink: 0; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12.5px;
    padding: 9px 14px; border-radius: 9px; border: none; cursor: pointer;
    background: #FC4C02; color: #fff;
  }
  .strava-btn:hover { filter: brightness(1.08); }
  .strava-btn.ghost { background: none; border: 1.5px solid #BEE6DF; color: #146B5F; }
  .strava-btn.ghost:hover { border-color: var(--teal); filter: none; }

  /* ---------- Countdown timer ---------- */
  .countdown-card {
    background: linear-gradient(180deg, #F4FBFA, var(--white));
    border: 1px solid #CBE8E2; border-radius: 14px;
    padding: 16px 16px 14px; margin-bottom: 20px;
  }
  .countdown-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; flex-wrap: wrap; gap: 6px; }
  .countdown-label { font-size: 11.5px; font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.09em; }
  .countdown-ends { font-size: 12px; color: var(--ink-soft); }
  .countdown-units { display: flex; gap: 8px; margin-bottom: 14px; }
  .cd-unit {
    flex: 1; background: var(--white); border: 1px solid var(--line);
    border-radius: 11px; padding: 11px 4px; text-align: center;
  }

  /* ---------- Registration screen ---------- */

  .podium {

  .podium-km { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

  /* ---------- Refined list rows ---------- */
  .rank-row { display: flex; align-items: center; gap: 12px; padding: 13px 4px; border-bottom: 1px solid var(--line); }
  .rank-row:last-child { border-bottom: none; }
  .rank-num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 13px; color: var(--ink-soft); width: 18px; flex-shrink: 0; }
  .rank-main { flex: 1; min-width: 0; }
  .rank-name { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .rank-meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .rank-km .u { font-size: 9.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }

  /* ---------- Scrollable board ---------- */
  .board-scroll {
    max-height: 420px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    border: 1px solid var(--line); border-radius: 12px; padding: 0 12px;

  .rank-row.is-me {
    background: var(--teal-light);

  .move-indicator.up { color: #146B5F; background: #E4F5F2; }
  .move-indicator.down { color: var(--red); background: var(--red-light); }
  .move-indicator.same { color: var(--ink-soft); background: var(--paper); }
  .move-indicator.new { color: #8A6110; background: var(--gold-light); }
  .name-wrap { flex: 1; min-width: 0; }
  .name-wrap .name { font-weight: 600; font-size: 13px; }
  .name-wrap .sub-badges { display: flex; gap: 5px; margin-top: 2px; align-items: center; }

  .metric-sub { font-size: 10.5px; color: var(--ink-soft); display: block; text-align: right; font-weight: 500; }
  .empty-state, .loading-state { padding: 26px 20px; text-align: center; color: var(--ink-soft); font-size: 13px; background: var(--paper); border-radius: 10px; border: 1px dashed var(--line); }

  /* ---------- Category distribution mini-bars ---------- */
  .dist-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }

  .dist-bar-fill { height: 100%; border-radius: 6px; }

  /* ---------- Admin ---------- */
  .admin-gate { padding: 40px 24px; max-width: 360px; margin: 0 auto; text-align: center; }
  .admin-section { margin-bottom: 24px; }

  .admin-config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  @media (max-width: 480px) {

<body>
<div class="app" id="app-root">
  <div class="loading-state" style="margin:60px 20px;">Loading…</div>
</div>

<script>
(function () {
  // ============ CONFIGURE THIS ============
  const BACKEND_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
  // ==========================================

  const root = document.getElementById('app-root');
  const PROFILE_KEY = 'runChallengeProfileV2';
  const ADMIN_KEY = 'runChallengeAdminPass';

  const CATEGORIES = [
    { id: 'Beginner', emoji: '🌱', short: 'Starting out / comfortable pace', desc: 'New to running? Start here and build the habit.' },
    { id: 'Intermediate', emoji: '🏃', short: 'Regular runner / ready to push', desc: 'Regular runner, ready to push a bit further.' },
    { id: 'Expert', emoji: '🔥', short: 'Experienced / performance focused', desc: 'Experienced runner — go for it.' }
  ];

  function emblem(size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" class="emblem" aria-hidden="true">
      <circle cx="50" cy="50" r="45" fill="#0B2A4A"/>
      <circle cx="50" cy="50" r="45" fill="none" stroke="#E3A62F" stroke-width="4"/>
      <circle cx="44" cy="30" r="9" fill="#1F9C8C"/>
      <path d="M44 40 L60 48 L50 56 L64 76 L54 80 L40 60 L28 68 L22 58 L38 48 Z" fill="#1F9C8C"/>
    </svg>`;
  }

  function loadProfile() { try { const r = localStorage.getItem(PROFILE_KEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function saveProfile(p) { localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); }
  function clearProfile() { localStorage.removeItem(PROFILE_KEY); }

  let state = {
    view: 'landing', // landing | login | register | app
    appTab: 'dashboard', // dashboard | leaderboard | admin
    profile: loadProfile(),
    loginId: '',
    registerDraft: null, // {employeeId, name, category}
    catFilter: 'all',
    weeklyStats: null,
    heroKm: null,
    stravaConnected: false,
    myCatStats: null,
    viewerSummary: null,
    adminData: null,
    adminPasscodeInput: '',
    formStatus: null,
    loading: false
  };

  function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function todayStr() { return new Date().toISOString().slice(0, 10); }

  // ---------- Backend calls ----------
  function jsonpRequest(url) {
    return new Promise((resolve, reject) => {
      const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
      const script = document.createElement('script');
      let done = false;
      window[cbName] = function (data) { done = true; resolve(data); cleanup(); };
      script.onerror = function () { if (!done) { reject(new Error('Could not reach backend.')); cleanup(); } };
      function cleanup() { delete window[cbName]; script.remove(); }
      const sep = url.indexOf('?') === -1 ? '?' : '&';
      script.src = url + sep + 'callback=' + cbName;
      document.body.appendChild(script);
      setTimeout(() => { if (!done) { reject(new Error('Request timed out.')); cleanup(); } }, 12000);
    });
  }
  async function postBackend(data) {
    await fetch(BACKEND_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
  }
  function lookupEmployee(employeeId) { return jsonpRequest(BACKEND_URL + '?action=lookup&employeeId=' + encodeURIComponent(employeeId)); }
  function loadWeeklyStats(category) { return jsonpRequest(BACKEND_URL + '?action=weeklyStats&category=' + encodeURIComponent(category || 'all')); }
  function loadViewerSummary() { return jsonpRequest(BACKEND_URL + '?action=viewerSummary'); }
  function loadAdmin(passcode) { return jsonpRequest(BACKEND_URL + '?action=admin&passcode=' + encodeURIComponent(passcode)); }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(() => {}); });
  }

  // ---------- Bootstrapping ----------
  async function init() {
    if (BACKEND_URL.indexOf('PASTE_YOUR') === 0) {
      root.innerHTML = '<div class="loading-state" style="margin:60px 20px;">⚠️ Set BACKEND_URL near the top of the &lt;script&gt; tag first.</div>';
      return;
    }
    if (state.profile) {
      // Re-verify against backend (source of truth), fall back to cached copy if offline
      try {
        const result = await lookupEmployee(state.profile.employeeId);
        if (result.found) { state.profile = result.employee; saveProfile(result.employee); }
      } catch (e) { /* keep cached profile */ }
      state.view = 'app';
      await goToTab('dashboard');
    } else {
      render();
    }
  }

  async function goToTab(tab) {
    clearCountdown();
    state.appTab = tab;
    state.loading = true;
    render();
    try {
      if (tab === 'dashboard' || tab === 'leaderboard') {
        state.weeklyStats = await loadWeeklyStats(tab === 'leaderboard' ? state.catFilter : (state.profile ? state.profile.category : 'all'));
      }
      if (tab === 'leaderboard' && state.profile) {
        // My Performance always reflects the person's OWN category,
        // regardless of which filter they're viewing.
        state.myCatStats = state.catFilter === state.profile.category
          ? state.weeklyStats
          : await loadWeeklyStats(state.profile.category);
      }
      if (tab === 'dashboard' && state.profile) {
        try {
          const st = await loadStravaStatus(state.profile.employeeId);
          state.stravaConnected = !!(st && st.connected);
        } catch (e) { /* Strava module may not be installed — card just shows disconnected */ }
      }
      // Hero always shows the all-category company total, regardless of tab
      const heroStats = await loadWeeklyStats('all');
      state.heroKm = heroStats.companyKm;
      state.heroStats = heroStats;
    } catch (e) { state.weeklyStats = null; }
    state.loading = false;
    render();
  }

  // ---------- Render root ----------
  function render() {
    if (state.view === 'landing') return renderLanding();
    if (state.view === 'summary') return renderSummaryView();
    if (state.view === 'register') return renderRegister();
    if (state.view === 'welcome') return renderWelcome();
    return renderApp();
  }

  function animateCount(el, to, duration) {
    const start = performance.now();
    const from = 0;
    const isDecimal = to % 1 !== 0;
    function tick(now) {
      const progress = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - progress, 3); // ease-out cubic
      const value = from + (to - from) * eased;
      el.textContent = isDecimal ? value.toFixed(1) : Math.round(value).toLocaleString();
      if (progress < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  function renderLanding() {
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const runnerMotion = reduceMotion ? '' : `
      <circle r="5" fill="#38C6B3">
        <animateMotion dur="7s" repeatCount="indefinite" path="M170,30 A150,55 0 1 1 169,30 Z" />
      </circle>`;

    root.innerHTML = `
      <div class="landing-dark">
        <div class="ambient-glow"></div>
        <div class="ambient-glow-2"></div>
        <div class="bg-track" style="top:20%;opacity:0.35;">
          <svg viewBox="0 0 340 110" class="bg-track-svg" aria-hidden="true">
            <ellipse cx="170" cy="55" rx="150" ry="45" fill="none" stroke="rgba(227,166,47,0.28)" stroke-width="2" stroke-dasharray="3 9" />
            ${runnerMotion}
          </svg>
        </div>
        <div class="landing-content">
          <div class="brand-row landing-fade d1">
            <div class="logo-tile">${emblem(30)}</div>
            <div class="brand-name">Broadcom Run 2026</div>
          </div>

          <div class="hero-eyebrow landing-fade d2">Move • Compete • Achieve</div>
          <h1 class="hero-headline landing-fade d2">Every kilometre <span class="accent-grad">moves the team forward.</span></h1>
          <p class="sub-dark landing-fade d3">Sign in, choose your running category, log your activity, and climb the leaderboard with your colleagues.</p>
          <p class="hero-footnote landing-fade d3">Corporate Wellness Challenge • Internal Use</p>

          <div class="landing-fade d3" id="live-ticker-slot"></div>

          <div class="quickstart-card landing-fade d4">
            <div class="card-top-bar"></div>
            <div class="badge-row">
              <span class="pill-live"><span class="pulse-dot"></span>LIVE CHALLENGE</span>
              <span class="secure-tag">🔒 Employees only</span>
            </div>

  // ---------- Countdown ----------
  let countdownTimer = null;

  function clearCountdown() {
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
  }

  function computeCountdown(config) {
    if (!config || !config.endDate) return null;
    const end = new Date(config.endDate + 'T23:59:59');
    if (isNaN(end.getTime())) return null;
    const start = config.startDate ? new Date(config.startDate + 'T00:00:00') : null;
    const now = new Date();
    const msLeft = end - now;

    let pct = 0;
    if (start && !isNaN(start.getTime())) {
      const total = end - start;
      pct = total > 0 ? Math.max(0, Math.min(100, ((now - start) / total) * 100)) : 0;
    }

    if (msLeft <= 0) return { ended: true, pct: 100, endLabel: formatEndDate(end) };

    const days = Math.floor(msLeft / 86400000);
    const hours = Math.floor((msLeft % 86400000) / 3600000);
    const mins = Math.floor((msLeft % 3600000) / 60000);
    const secs = Math.floor((msLeft % 60000) / 1000);
    return { ended: false, days, hours, mins, secs, pct, endLabel: formatEndDate(end) };
  }

  function formatEndDate(d) {
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function renderCountdownHtml(cd) {
    if (!cd) return '';
    if (cd.ended) {
      return `
        <div class="countdown-card">
          <div class="countdown-top"><span class="countdown-label">Challenge Complete</span><span class="countdown-ends">Ended ${escapeHtml(cd.endLabel)}</span></div>
          <div class="countdown-ended">🏁 Final results are in</div>
          <div class="cd-progress-track"><div class="cd-progress-fill" style="width:100%"></div></div>
        </div>`;
    }
    return `
      <div class="countdown-card" id="countdown-card">
        <div class="countdown-top">
          <span class="countdown-label">Time Remaining</span>
          <span class="countdown-ends">Ends ${escapeHtml(cd.endLabel)}</span>
        </div>
        <div class="countdown-units">
          <div class="cd-unit"><div class="v" id="cd-days">${cd.days}</div><div class="l">Days</div></div>
          <div class="cd-unit"><div class="v" id="cd-hours">${pad2(cd.hours)}</div><div class="l">Hours</div></div>
          <div class="cd-unit"><div class="v" id="cd-mins">${pad2(cd.mins)}</div><div class="l">Mins</div></div>
          <div class="cd-unit"><div class="v" id="cd-secs">${pad2(cd.secs)}</div><div class="l">Secs</div></div>
        </div>
        <div class="cd-progress-track">
          <div class="cd-progress-fill" id="cd-fill" style="width:${cd.pct}%"></div>
          <div class="cd-progress-dot" id="cd-dot" style="left:${cd.pct}%"></div>
        </div>
      </div>`;
  }

  function startCountdown(config) {
    clearCountdown();
    if (!config || !config.endDate) return;
    countdownTimer = setInterval(() => {
      const cd = computeCountdown(config);
      const daysEl = document.getElementById('cd-days');
      if (!daysEl || !cd) { clearCountdown(); return; } // card no longer on screen
      if (cd.ended) { clearCountdown(); goToTab(state.appTab); return; }
      daysEl.textContent = cd.days;
      document.getElementById('cd-hours').textContent = pad2(cd.hours);
      document.getElementById('cd-mins').textContent = pad2(cd.mins);
      document.getElementById('cd-secs').textContent = pad2(cd.secs);
      const fill = document.getElementById('cd-fill');
      const dot = document.getElementById('cd-dot');
      if (fill) fill.style.width = cd.pct + '%';
      if (dot) dot.style.left = cd.pct + '%';
    }, 1000);
  }

  function renderMyPerformance(myCatStats) {
    if (!state.profile || !myCatStats) return '';
    const rows = myCatStats.top10 || [];
    const myId = String(state.profile.employeeId).toLowerCase();
    const idx = rows.findIndex(r => String(r.employeeId).toLowerCase() === myId);

    if (idx === -1) {
      return `
        <div class="perf-card">
          <div class="perf-top">
            <span class="perf-label">My Performance</span>
            <span class="perf-cat">${escapeHtml(state.profile.category)} category</span>
          </div>
          <div class="perf-nudge">🏃 You haven't logged a run this week yet — log one to get on the board.</div>
        </div>`;
    }

    const me = rows[idx];
    const rank = idx + 1;
    let nudge;
    if (idx === 0) {
      const behind = rows[1];
      nudge = behind
        ? `<div class="perf-nudge leading">🥇 You're leading your category — <strong>${(me.distanceKm - behind.distanceKm).toFixed(1)} km</strong> ahead of second place.</div>`
        : `<div class="perf-nudge leading">🥇 You're leading your category. Keep it up.</div>`;
    } else {
      const above = rows[idx - 1];
      const gap = above.distanceKm - me.distanceKm;
      nudge = `<div class="perf-nudge">🏃 Only <strong>${gap.toFixed(1)} km</strong> more to overtake ${escapeHtml(above.name)} above you.</div>`;
    }

    return `
      <div class="perf-card">
        <div class="perf-top">
          <span class="perf-label">My Performance</span>
          <span class="perf-cat">${escapeHtml(state.profile.category)} category</span>
        </div>
        <div class="perf-units">
          <div class="perf-unit"><div class="v">#${rank}</div><div class="l">My Rank</div></div>
          <div class="perf-unit"><div class="v">${me.distanceKm.toFixed(1)}</div><div class="l">Total km</div></div>
          <div class="perf-unit"><div class="v">${me.runs}</div><div class="l">Runs</div></div>
          <div class="perf-unit"><div class="v">${me.days}</div><div class="l">Days Active</div></div>
        </div>
        ${nudge}
      </div>`;
  }

  function initials(name) {
    const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return '??';
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }

  function renderPodium(top3) {
    if (top3.length === 0) return '';
    // Display order: 2nd, 1st, 3rd (1st elevated in the middle)
    const order = [top3[1], top3[0], top3[2]];
    const medals = ['🥈', '🥇', '🥉'];
    return `
      <div class="podium">
        ${order.map((r, i) => {
          if (!r) return '<div class="podium-slot"></div>';
          const isFirst = (i === 1);
          return `
            <div class="podium-slot ${isFirst ? 'first' : ''}">
              <div class="podium-medal">${medals[i]}</div>
              <div class="podium-avatar">${escapeHtml(initials(r.name))}</div>
              <div class="podium-name">${escapeHtml(r.name)}</div>
              <div class="podium-km">${r.distanceKm.toFixed(1)} km</div>
            </div>`;
        }).join('')}
      </div>`;
  }

  function renderRankRows(rows) {
    const myId = state.profile ? String(state.profile.employeeId).toLowerCase() : null;
    return rows.map((r, i) => {
      const isMe = myId && String(r.employeeId).toLowerCase() === myId;
      return `
      <div class="rank-row ${isMe ? 'is-me' : ''}" ${isMe ? 'id="my-rank-row"' : ''}>
        <span class="rank-num">${i + 1}</span>
        <div class="rank-main">
          <div class="rank-name">${escapeHtml(r.name)}</div>
          <div class="rank-meta">
            <span class="move-indicator ${r.movement || 'same'}">${moveLabel(r)}</span>
            <span class="cat-badge ${r.category}">${escapeHtml(r.category)}</span>
            <span>${r.days} day${r.days === 1 ? '' : 's'} · ${r.runs} run${r.runs === 1 ? '' : 's'}</span>
            ${r.streak ? '<span>🔥</span>' : ''}
          </div>
        </div>
        <div class="rank-km"><div class="v">${r.distanceKm.toFixed(1)}</div><div class="u">km</div></div>
      </div>`;
    }).join('');
  }

  function renderLeaderboardTab(panel) {
    if (state.loading) { panel.innerHTML = '<div class="loading-state">Loading leaderboard…</div>'; return; }
    const s = state.weeklyStats;
    if (!s) { panel.innerHTML = '<div class="empty-state">Could not load the leaderboard right now.</div>'; return; }

    const avgKm = s.participants > 0 ? (s.companyKm / s.participants) : 0;
    const top3 = s.top10.slice(0, 3);
    const cd = computeCountdown(s.config);

    panel.innerHTML = `
      <div class="board-header">
        <span class="live-pill"><span class="dot"></span>LIVE LEADERBOARD</span>
        <h2 class="board-h1">Running scoreboard</h2>
        <p class="board-h1-sub">Ranked by total kilometres · ${escapeHtml(s.rangeStart)} – ${escapeHtml(s.rangeEnd)}</p>
      </div>

      ${renderCountdownHtml(cd)}

      ${renderMyPerformance(state.myCatStats)}

      <div class="seg-tabs" id="seg-tabs">
        <button data-cat="all" class="${state.catFilter === 'all' ? 'active' : ''}">All</button>
        ${CATEGORIES.map(c => `<button data-cat="${c.id}" class="${state.catFilter === c.id ? 'active' : ''}">${c.id}</button>`).join('')}
      </div>

      <div class="stat-strip">
        <div class="stat-cell"><div class="num">${s.participants}</div><div class="label">Runners</div></div>
        <div class="stat-cell"><div class="num">${s.companyKm.toFixed(1)}</div><div class="label">Total km</div></div>
        <div class="stat-cell"><div class="num">${avgKm.toFixed(1)}</div><div class="label">Avg km</div></div>
      </div>
      ${renderPodium(top3)}

      ${s.top10.length === 0
        ? '<div class="empty-state">No runs logged in this period yet — be the first!</div>'
        : `<div class="board-scroll" id="board-scroll">${renderRankRows(s.top10)}</div>
           <div class="board-count">Showing all ${s.top10.length} runner${s.top10.length === 1 ? '' : 's'} — scroll to see more</div>`}
    `;
    panel.querySelectorAll('#seg-tabs button').forEach(btn => {
      btn.addEventListener('click', () => { state.catFilter = btn.dataset.cat; goToTab('leaderboard'); });
    });

    // If the person is on this board but below the fold, offer a jump link
    const myRow = panel.querySelector('#my-rank-row');
    const scrollBox = panel.querySelector('#board-scroll');
    if (myRow && scrollBox) {
      const needsJump = myRow.offsetTop > scrollBox.clientHeight - 60;
      if (needsJump) {
        const jumpBtn = document.createElement('button');
        jumpBtn.className = 'jump-me-btn';
        jumpBtn.textContent = '↓ Jump to my position';
        jumpBtn.addEventListener('click', () => {
          scrollBox.scrollTo({ top: myRow.offsetTop - 100, behavior: 'smooth' });
        });
        scrollBox.parentNode.insertBefore(jumpBtn, scrollBox.nextSibling.nextSibling);
      }
    }
    startCountdown(s.config);
  }

  function renderAdminTab(panel) {
    if (!state.adminData || !state.adminData.authorized) {
      panel.innerHTML = `
        <div class="admin-gate">
          <div class="board-title">Admin Access</div>
          <div class="field"><label for="admin-pass">Passcode</label><input id="admin-pass" type="password" placeholder="Enter admin passcode" /></div>
          <button class="submit-btn" id="admin-unlock-btn">Unlock</button>
          <div id="admin-gate-status"></div>
        </div>
      `;
      panel.querySelector('#admin-unlock-btn').addEventListener('click', async () => {
        const pass = panel.querySelector('#admin-pass').value;
        const statusEl = panel.querySelector('#admin-gate-status');
        try {
          const result = await loadAdmin(pass);
          if (result.authorized) {
            state.adminData = result;
            sessionStorage.setItem(ADMIN_KEY, pass);
            renderAdminTab(panel);
          } else {
            statusEl.innerHTML = '<div class="error-msg">Incorrect passcode.</div>';
          }
        } catch (e) {
          statusEl.innerHTML = '<div class="error-msg">Could not reach the server.</div>';
        }
      });
      return;
    }

    const d = state.adminData;
    panel.innerHTML = `
      <div class="stat-row">
        <div class="stat-card"><div class="num display">${d.totalEmployees}</div><div class="label">Registered</div></div>
        <div class="stat-card"><div class="num display">${d.totalEntries}</div><div class="label">Runs logged</div></div>
        <div class="stat-card"><div class="num display">${d.allTimeKm.toFixed(1)}</div><div class="label">Total km all-time</div></div>
      </div>

      <div class="admin-section">
        <h4>Category Breakdown</h4>
        ${Object.keys(d.categoryCounts).map(cat => `
          <div class="dist-row">
            <div class="dist-label">${cat}</div>
            <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.min(100, d.categoryCounts[cat] * 3)}%;background:var(--teal)"></div></div>
            <div class="dist-count">${d.categoryCounts[cat]}</div>
          </div>`).join('')}
      </div>

      <div class="admin-section">
        <h4>Challenge Settings</h4>
        <div class="admin-config-grid">
          <div class="field"><label>Title</label><input id="cfg-title" type="text" value="${escapeHtml(d.config.title)}" /></div>
          <div class="field"><label>Company Target (km)</label><input id="cfg-company" type="number" value="${d.config.companyTargetKm}" /></div>
          <div class="field"><label>Start Date</label><input id="cfg-start" type="date" value="${d.config.startDate}" /></div>
          <div class="field"><label>End Date</label><input id="cfg-end" type="date" value="${d.config.endDate}" /></div>
          <div class="field"><label>Beginner Target (km)</label><input id="cfg-beg" type="number" value="${d.config.categoryTargets.Beginner}" /></div>
          <div class="field"><label>Intermediate Target (km)</label><input id="cfg-int" type="number" value="${d.config.categoryTargets.Intermediate}" /></div>
          <div class="field"><label>Expert Target (km)</label><input id="cfg-exp" type="number" value="${d.config.categoryTargets.Expert}" /></div>
        </div>
        <button class="submit-btn" id="cfg-save-btn" style="max-width:200px;margin-top:14px;">Save Settings</button>
        <div id="cfg-status"></div>
      </div>

      <div class="admin-section">
        <h4>Employees (${d.employees.length})</h4>
        <div class="table-wrap"><table class="admin-table">
          <tr><th>ID</th><th>Name</th><th>Category</th></tr>
          ${d.employees.map(e => `<tr><td class="mono">${escapeHtml(e.employeeId)}</td><td>${escapeHtml(e.name)}</td><td>${escapeHtml(e.category)}</td></tr>`).join('')}
        </table></div>
      </div>

      <button class="ghost-btn" id="csv-btn">Download full entries log as CSV</button>
    `;

    panel.querySelector('#cfg-save-btn').addEventListener('click', async () => {
      const statusEl = panel.querySelector('#cfg-status');
      const passcode = sessionStorage.getItem(ADMIN_KEY);
      await postBackend({
        action: 'updateConfig', passcode: passcode,
        title: panel.querySelector('#cfg-title').value,
        companyTargetKm: panel.querySelector('#cfg-company').value,
        startDate: panel.querySelector('#cfg-start').value,
        endDate: panel.querySelector('#cfg-end').value,
        beginnerKm: panel.querySelector('#cfg-beg').value,
        intermediateKm: panel.querySelector('#cfg-int').value,
        expertKm: panel.querySelector('#cfg-exp').value
      });
      statusEl.innerHTML = '<div class="confirm-msg">Saved (allow a few seconds for it to fully sync).</div>';
      setTimeout(async () => { state.adminData = await loadAdmin(passcode); renderAdminTab(panel); }, 1500);
    });

    panel.querySelector('#csv-btn').addEventListener('click', () => {
      const rows = [['EmployeeID', 'Name', 'Category', 'Date', 'Distance (km)', 'Duration (min)']];
      d.entries.forEach(e => rows.push([e.employeeId, e.name, e.category, e.date, e.distanceKm, e.minutes]));
      const csv = rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'running-challenge-entries.csv'; a.click();
      URL.revokeObjectURL(url);
    });
  }

  init();
})();
</script>
</body>
</html>
